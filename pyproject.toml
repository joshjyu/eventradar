[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "eventradar"
version = "0.1.0"
description = "Config-driven discovery and publishing of regional events."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Joshua Yu" }]
dependencies = [
    "boto3>=1.37",
    "httpx>=0.28",
    "icalendar>=6.1",
    "pydantic>=2.10",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.6",
    "typer>=0.15",
    "tzfpy>=2.1.0",
]

[project.scripts]
eventradar = "eventradar.cli:app"

[project.entry-points."eventradar.sources"]
ical = "eventradar.sources.protocols.ical:IcalSource"
jsonld = "eventradar.sources.protocols.jsonld:JsonLdSource"
devpost = "eventradar.sources.platforms.devpost:DevpostSource"
eventbrite = "eventradar.sources.platforms.eventbrite:EventbriteSource"
meetup = "eventradar.sources.platforms.meetup:MeetupSource"

[project.entry-points."eventradar.geocoders"]
census = "eventradar.geo.geocode.providers.census:CensusGeocoder"

[project.entry-points."eventradar.alerters"]
github-issue = "eventradar.health.alerts.github_issue:GitHubIssueAlerter"
log = "eventradar.health.alerts.log:LogAlerter"

[project.entry-points."eventradar.blob"]
local = "eventradar.storage.blob.local:LocalBlobStore"
s3 = "eventradar.storage.blob.s3:S3BlobStore"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pre-commit>=4.0",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eventradar"]

[tool.ruff]
line-length = 80
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real network endpoints (canary only)"]
addopts = "-m 'not live'"
