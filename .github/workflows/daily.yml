name: daily

on:
  # Started daily at 12:00 UTC by the Cloudflare Worker in workers/scheduler
  # (see docs/scheduler.md), or manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Secrets live only in this environment, which is restricted to `main`.
    environment: production
    permissions:
      contents: read
      # Source health alerts are filed as issues.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.14"
      - run: uv sync --locked --no-dev
      - name: Run pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_STATE_BUCKET: ${{ secrets.R2_STATE_BUCKET }}
          R2_PUBLIC_BUCKET: ${{ secrets.R2_PUBLIC_BUCKET }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENTRADAR_ARTIFACT_DIR: health-artifacts
        run: |
          if [ -n "$R2_ACCOUNT_ID" ]; then
            uv run eventradar run --env production
          else
            echo "::warning::R2 secrets not configured; dry run only"
            uv run eventradar run --env local --no-publish
          fi
      - name: Upload health captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-captures
          path: health-artifacts/
          if-no-files-found: ignore
          retention-days: 14
