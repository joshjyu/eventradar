name: dependabot-automerge

# Enables auto-merge on Dependabot's minor and patch PRs for Python and
# npm; the `main` ruleset holds the merge until required checks pass.
# Actions updates change code that runs with production secrets, and
# major updates may break APIs, so both wait for review. See ADR 0013.
on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Verifies the PR's commits are Dependabot's before reading them.
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Ecosystem names come from the branch (dependabot/<ecosystem>/...).
      # An empty update-type (unknown version change) does not match.
      - if: >-
          contains(fromJSON('["uv", "npm_and_yarn"]'),
          steps.meta.outputs.package-ecosystem)
          && contains(fromJSON('["version-update:semver-minor",
          "version-update:semver-patch"]'), steps.meta.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
