version: 2

# Groups hold minor and patch updates; Python and npm groups auto-merge
# once CI passes (workflows/dependabot-automerge.yml). Major and Actions
# updates wait for review, major ones as separate PRs. The cooldown
# skips releases younger than a week, so a compromised release is
# usually pulled before it is proposed. Security updates ignore it.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /workers/scheduler
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      worker:
        patterns: ["*"]
        update-types: [minor, patch]
