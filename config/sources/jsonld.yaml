version: 1

# Eventbrite city hubs: the JSON-LD ItemList on each listing page links to
# event pages, whose JSON-LD holds the full event. Hubs keep returning
# loosely related results on later pages, so `pages` is a hard cap.
#
# Disabled: Eventbrite answers HTTP 405 to requests from cloud datacenter
# IPs (e.g. GitHub-hosted runners). Eventbrite coverage moves to its
# official API.
sources:
  - id: eventbrite-la-tech
    adapter: jsonld
    enabled: false
    params:
      discovery:
        type: hub
        pages: 3
        urls:
          - "https://www.eventbrite.com/d/ca--los-angeles/science-and-tech--events/?page={page}"
          - "https://www.eventbrite.com/d/ca--los-angeles/hackathon/?page={page}"
      url_pattern: '^https://www\.eventbrite\.com/e/'
      default_tz: America/Los_Angeles
      max_events: 150

  - id: eventbrite-oc-tech
    adapter: jsonld
    enabled: false
    params:
      discovery:
        type: hub
        pages: 2
        urls:
          - "https://www.eventbrite.com/d/ca--irvine/science-and-tech--events/?page={page}"
          - "https://www.eventbrite.com/d/ca--irvine/hackathon/?page={page}"
      url_pattern: '^https://www\.eventbrite\.com/e/'
      default_tz: America/Los_Angeles
      max_events: 100

  - id: eventbrite-sd-tech
    adapter: jsonld
    enabled: false
    params:
      discovery:
        type: hub
        pages: 3
        urls:
          - "https://www.eventbrite.com/d/ca--san-diego/science-and-tech--events/?page={page}"
          - "https://www.eventbrite.com/d/ca--san-diego/hackathon/?page={page}"
      url_pattern: '^https://www\.eventbrite\.com/e/'
      default_tz: America/Los_Angeles
      max_events: 150

  # OC Tech Week's own site links to each event's Luma page.
  - id: site-oc-tech-week
    adapter: jsonld
    priority: 60
    params:
      discovery:
        type: links
        urls:
          - "https://octechweek.com/"
      url_pattern: '^https://(luma\.com|lu\.ma)/[A-Za-z0-9-]+$'
      default_tz: America/Los_Angeles
      max_events: 100
